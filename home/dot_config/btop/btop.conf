# bombwcc btop configuration

# Use the bundled theme name instead of a Homebrew version-specific path.
color_theme = "bombwcc-gruvbox"
theme_background = true
truecolor = true
rounded_corners = true

# Keep resource usage reasonable on small VPS instances.
update_ms = 2000
shown_boxes = "cpu mem net proc"
proc_sorting = "cpu lazy"
proc_mem_bytes = true
proc_cpu_graphs = true
graph_symbol = "braille"

# Keyboard and terminal integration.
vim_keys = true
disable_mouse = false
terminal_sync = true

# Keep this file declarative instead of rewriting it when btop exits.
save_config_on_exit = false
