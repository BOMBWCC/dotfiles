# Use 1-based window and pane numbers.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Responsive input and a larger scrollback buffer.
set -sg escape-time 10
set -g history-limit 50000
set -g focus-events on

# Terminal, color and clipboard support.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",screen-256color:RGB"
set -g set-clipboard on
set -g mouse on

# Vi-style copy mode to match the shell input mode.
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Reload with prefix + r.
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux configuration reloaded"

# Gruvbox status line.
set -g status-position bottom
set -g status-style "bg=#282828,fg=#a89984"
set -g message-style "bg=#fabd2f,fg=#282828"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#8ec07c"
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#458588,fg=#fbf1c7,bold] #I:#W #[default]"
set -g status-left "#[fg=#282828,bg=#b8bb26,bold] #S #[default]"
set -g status-right "#[fg=#a89984]#H  %Y-%m-%d %H:%M "
